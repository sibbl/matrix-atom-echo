name: Publish bridge image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install bridge dependencies
        working-directory: bridge
        run: npm ci

      - name: Run bridge checks
        working-directory: bridge
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/matrix-atom-echo-bridge
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=matrix-atom-echo-bridge
            org.opencontainers.image.description=Bridge service for Matrix Atom Echo
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./bridge
          file: ./bridge/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
